name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Multi-Platform Build & Verification Matrix
  # ---------------------------------------------------------------------------
  build-matrix:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: macos-aarch64
          - os: windows-latest
            suffix: windows-amd64
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        shell: bash
        run: ./mvnw clean package -B

      - name: Build Native Distribution Package
        shell: bash
        run: |
          # Use jlink to assemble custom minimal JRE with required modules
          jlink --add-modules java.base,java.management,java.net.http,java.sql,java.naming,jdk.attach,jdk.management,jdk.management.agent,java.instrument,jdk.internal.jvmstat \
                --output custom-jre \
                --strip-debug \
                --no-man-pages \
                --no-header-files

          # Dynamically locate the shaded fat jar (eliminating hardcoded SNAPSHOT)
          SHADED_JAR=$(find mcp-server/target -maxdepth 1 -name "jvm-mcp-server-*.jar" ! -name "original-*" | head -n 1)
          if [ -z "$SHADED_JAR" ] || [ ! -f "$SHADED_JAR" ]; then
            echo "Error: Could not locate shaded jar matching jvm-mcp-server-*.jar in mcp-server/target" >&2
            exit 1
          fi
          echo "Found shaded jar: $SHADED_JAR"
          JAR_NAME=$(basename "$SHADED_JAR")

          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            jpackage --type app-image \
                     --name jvm-mcp \
                     --input mcp-server/target \
                     --main-jar "$JAR_NAME" \
                     --main-class dev.jvmmcp.JvmMcp \
                     --runtime-image custom-jre \
                     --dest build-out
            cd build-out
            7z a "../jvm-mcp-${{ matrix.suffix }}.zip" jvm-mcp
            cd ..
          else
            # Linux and macOS
            mkdir -p dist
            cp -r custom-jre dist/
            cp "$SHADED_JAR" dist/app.jar

            # Embed canonical symlink-safe recursive bash launcher
            cat << 'EOF' > dist/jvm-mcp
#!/usr/bin/env bash
set -e

SOURCE="${BASH_SOURCE[0]}"
while [ -h "$SOURCE" ] || [ -L "$SOURCE" ]; do
  DIR="$( cd -P "$( dirname "$SOURCE" )" >/dev/null 2>&1 && pwd )"
  SOURCE="$(readlink "$SOURCE")"
  [[ $SOURCE != /* ]] && SOURCE="$DIR/$SOURCE"
done
DIR="$( cd -P "$( dirname "$SOURCE" )" >/dev/null 2>&1 && pwd )"

exec "$DIR/custom-jre/bin/java" -jar "$DIR/app.jar" "$@"
EOF
            chmod +x dist/jvm-mcp
            cp dist/jvm-mcp "dist/jvm-mcp-${{ matrix.suffix }}"
            tar -czvf "jvm-mcp-${{ matrix.suffix }}.tar.gz" -C dist .
          fi

      - name: Verify Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p verify_app
          tar -xzf "jvm-mcp-${{ matrix.suffix }}.tar.gz" -C verify_app
          # Direct verification
          ./verify_app/jvm-mcp --version
          # Symlink resolution verification
          mkdir -p verify_app/test_bin
          ln -s ../jvm-mcp verify_app/test_bin/jvm-mcp
          ./verify_app/test_bin/jvm-mcp --version
          echo "Linux/macOS executable verified successfully."

      - name: Verify Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $binaryPath = "build-out\jvm-mcp\jvm-mcp.exe"
          $process = Start-Process -FilePath $binaryPath -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "Executable failed with exit code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Windows app-image verified successfully."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jvm-mcp-${{ matrix.suffix }}
          path: jvm-mcp-${{ matrix.suffix }}.*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage 2: Checksum Calculation & Atomic Release Publication
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Calculate Checksums
        run: |
          cd artifacts
          echo "Release artifacts present in workspace:"
          ls -la

          # Generate individual SHA-256 files for each archive
          for file in jvm-mcp-*.tar.gz jvm-mcp-*.zip; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done

          # Generate canonical checksums.txt containing all checksums
          sha256sum jvm-mcp-*.tar.gz jvm-mcp-*.zip > checksums.txt

          echo "Canonical checksums.txt:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
